function cx(...a) { return a.filter(Boolean).join(" "); }

function formatCount(n) {
  return Math.round(n).toLocaleString("en-US");
}

function Counter({ value, decimals = 0, suffix = "", prefix = "", duration = 1.8 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: "-80px" });
  const [display, setDisplay] = useState(0);

  useEffect(() => {
    if (!inView) return;
    let raf;
    let start = null;
    const tick = (ts) => {
      if (start === null) start = ts;
      const t = Math.min((ts - start) / (duration * 1000), 1);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(value * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [inView, value, duration]);

  return (
    <span ref={ref} className="num-tabular">
      {prefix}{display.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}{suffix}
    </span>
  );
}

function Reveal({ children, delay = 0, className = "", y = 22 }) {

      initial={{ opacity: 0, y }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once: true, margin: "-60px" }}
      transition={{ duration: 0.65, delay, ease: [0.16, 1, 0.3, 1] }}
    >
      {children}
    </motion.div>
  );
}

function useContinentDots() {
  return useMemo(() => {
    const blobs = [
      { cx: 22.2, cy: 12.5, rx: 9.7, ry: 6.9, n: 130 },
      { cx: 38.3, cy: 5.0, rx: 2.8, ry: 2.2, n: 14 },
      { cx: 33.3, cy: 29.2, rx: 5.6, ry: 9.7, n: 100 },
      { cx: 54.2, cy: 11.1, rx: 5.0, ry: 4.2, n: 55 },
      { cx: 55.6, cy: 25.0, rx: 6.9, ry: 10.6, n: 120 },
      { cx: 75.0, cy: 12.5, rx: 12.5, ry: 6.9, n: 150 },
      { cx: 73.6, cy: 20.8, rx: 5.6, ry: 4.2, n: 65 },
      { cx: 87.5, cy: 31.9, rx: 4.2, ry: 2.8, n: 40 },
    ];
    const pts = [];
    blobs.forEach((b, bi) => {
      let placed = 0, attempts = 0;
      while (placed < b.n && attempts < b.n * 8) {
        attempts++;
        const dx = Math.random() * 2 - 1;
        const dy = Math.random() * 2 - 1;
        if (dx * dx + dy * dy <= 1) {
          pts.push({ x: b.cx + dx * b.rx, y: b.cy + dy * b.ry, r: Math.random() * 0.28 + 0.24, o: Math.random() * 0.35 + 0.18, key: bi + "-" + placed });
          placed++;
        }
      }
    });
    return pts;
  }, []);
}

function lonLatToXY(lon, lat) {
  return { x: ((lon + 180) / 360) * 100, y: ((90 - lat) / 180) * 50 };
}

function WorldMap({ challenges, onPick, hoveredId, setHoveredId }) {
  const dots = useContinentDots();
  const arcs = [
    [0, 3], [1, 5], [4, 8], [2, 9], [6, 11],
  ];

  return (
    <div className="relative w-full">
      <svg viewBox="0 0 100 50" className="w-full h-auto overflow-visible" role="img" aria-label="World map showing active challenge locations">
        {dots.map((p) => (
          <circle key={p.key} cx={p.x} cy={p.y} r={p.r} fill="var(--text-2)" opacity={p.o} />
        ))}

        {arcs.map(([a, b], i) => {
          const p1 = lonLatToXY(challenges[a].lon, challenges[a].lat);
          const p2 = lonLatToXY(challenges[b].lon, challenges[b].lat);
          const mx = (p1.x + p2.x) / 2;
          const my = Math.min(p1.y, p2.y) - 8;
          const d = "M " + p1.x + " " + p1.y + " Q " + mx + " " + my + " " + p2.x + " " + p2.y;
          return (
            <motion.path
              key={i}
              d={d}
              fill="none"
              stroke="var(--accent)"
              strokeWidth="0.18"
              vectorEffect="non-scaling-stroke"
              opacity="0.45"
              initial={{ pathLength: 0, opacity: 0 }}
              whileInView={{ pathLength: 1, opacity: 0.45 }}
              viewport={{ once: true }}
              transition={{ duration: 1.8, delay: i * 0.25, ease: "easeInOut" }}
            />
          );
        })}

        {challenges.map((c) => {
          const { x, y } = lonLatToXY(c.lon, c.lat);
          const active = hoveredId === c.id;
          return (
            <g key={c.id} transform={"translate(" + x + "," + y + ")"} style={{ cursor: "pointer" }}
               onMouseEnter={() => setHoveredId(c.id)} onMouseLeave={() => setHoveredId(null)}
               onClick={() => onPick(c)}>
              <circle r="2.6" fill="var(--accent)" opacity="0.18" className="node-ping" style={{ color: "var(--accent)" }} />
              <circle r={active ? 1.3 : 1.0} fill="var(--accent)" stroke="var(--bg-0)" strokeWidth="0.25" vectorEffect="non-scaling-stroke" />
            </g>
          );
        })}
      </svg>

      <AnimatePresence>
        {hoveredId && (() => {
          const c = challenges.find((x) => x.id === hoveredId);
          if (!c) return null;
          const { x, y } = lonLatToXY(c.lon, c.lat);
          return (
            <motion.div
              initial={{ opacity: 0, y: 6, scale: 0.96 }}
              animate={{ opacity: 1, y: 0, scale: 1 }}
              exit={{ opacity: 0 }}
              transition={{ duration: 0.15 }}
              className="pointer-events-none absolute z-10 -translate-x-1/2 -translate-y-full glass-strong rounded-xl px-3 py-2 text-xs whitespace-nowrap"
              style={{ left: x + "%", top: (y / 50) * 100 - 3 + "%", boxShadow: "var(--shadow)" }}
            >
              <div className="font-semibold text-[var(--text-0)]">{c.emoji} {c.title}</div>
              <div className="text-[var(--text-1)]">{c.location}</div>
            </motion.div>
          );
        })()}
      </AnimatePresence>
    </div>
  );
}

    <Reveal delay={delay} className="flex flex-col items-center rounded-3xl glass p-6 text-center">

            initial={{ strokeDashoffset: c }}

function RadialScore({ value, max = 10 }) {
  const r = 54, c = 2 * Math.PI * r;
  const pct = value / max;
  return (
    <div className="relative grid h-36 w-36 place-items-center">
      <svg viewBox="0 0 120 120" className="absolute inset-0 -rotate-90">
        <circle cx="60" cy="60" r={r} fill="none" stroke="var(--surface-strong)" strokeWidth="8" />
        <motion.circle
          cx="60" cy="60" r={r} fill="none" stroke="var(--accent)" strokeWidth="8" strokeLinecap="round"
          strokeDasharray={c}
          initial={{ strokeDashoffset: c }}
          whileInView={{ strokeDashoffset: c - c * pct }}
          viewport={{ once: true }}
          transition={{ duration: 1.4, ease: "easeOut" }}
        />
      </svg>
      <div className="text-center">
        <div className="font-display text-3xl font-semibold"><Counter value={value} decimals={1} /></div>
        <div className="text-xs text-[var(--text-2)]">of {max}</div>
      </div>
    </div>
  );
}

        <label className="mt-6 block text-xs font-medium text-[var(--text-2)]" htmlFor="join-name">Your name</label>
        <input
          id="join-name" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Sam Rivera"
          className="mt-2 w-full rounded-2xl glass px-4 py-3 text-sm text-[var(--text-0)] placeholder:text-[var(--text-2)] focus:bg-[var(--surface-hover)]"
        />

        <div className="mt-5 text-xs font-medium text-[var(--text-2)]">Causes you care about</div>
        <div className="mt-2 flex flex-wrap gap-2">
          {CATEGORIES.map((cat) => (
            <button
              key={cat}
              onClick={() => toggle(cat)}
              className={cx("rounded-full px-3.5 py-2 text-xs font-medium transition-colors", picked.includes(cat) ? "grad-brand" : "glass text-[var(--text-1)] hover:bg-[var(--surface-hover)]")}
              style={picked.includes(cat) ? { color: "var(--accent-ink)" } : {}}
            >
              {cat}
            </button>
          ))}
        </div>

        <button
          onClick={() => onSubmit(name.trim() || "Explorer")}
          className="mt-7 inline-flex w-full items-center justify-center gap-2 rounded-full px-6 py-3.5 text-sm font-semibold transition hover:brightness-110 active:scale-[0.98] grad-brand"
          style={{ color: "var(--accent-ink)" }}
        >
          Get started <ArrowRight className="h-4 w-4" />
        </button>
      </motion.div>
    </motion.div>
  );
}

/* ----------------------------- App ------------------------------ */

function App() {
  const [theme, setTheme] = useState("dark");
  const [selected, setSelected] = useState(null);
  const [joinedIds, setJoinedIds] = useState(() => new Set());
  const [hoveredId, setHoveredId] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [user, setUser] = useState({ name: "", joined: false });
  const [showJoin, setShowJoin] = useState(false);
  const [challenges, setChallenges] = useState(CHALLENGES);

  useEffect(() => {
    document.documentElement.classList.toggle("light", theme === "light");
  }, [theme]);

  const pushToast = useCallback((emoji, message) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, emoji, message }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }, []);

  const scrollTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });

  const handleJoinChallenge = (challenge) => {
    if (joinedIds.has(challenge.id)) return;
    setJoinedIds((s) => new Set(s).add(challenge.id));
    setChallenges((list) => list.map((c) => (c.id === challenge.id ? { ...c, participants: c.participants + 1 } : c)));
    pushToast(challenge.emoji, "You joined " + challenge.title + ". First action unlocked.");
    setSelected((sel) => (sel ? { ...sel, participants: sel.participants + 1 } : sel));
  };

  const handleStartImpact = () => {
    if (!user.joined) setShowJoin(true);
    else scrollTo("explore");
  };

  const handleJoinSubmit = (name) => {
    setUser({ name, joined: true });
    setShowJoin(false);
    pushToast("🎉", "Welcome to ImpactHub, " + name + "!");
    setTimeout(() => scrollTo("dashboard"), 300);
  };

  return (
    <div className="min-h-screen">
      <Navbar theme={theme} onToggleTheme={() => setTheme((t) => (t === "dark" ? "light" : "dark"))} joined={user.joined} onJoinClick={() => (user.joined ? scrollTo("dashboard") : setShowJoin(true))} />

      <Hero
        onExplore={() => scrollTo("challenges")}
        onStart={handleStartImpact}
        challenges={challenges}
        onPickChallenge={setSelected}
        hoveredId={hoveredId}
        setHoveredId={setHoveredId}
      />

      <StatsSection />
      <TrendingSection challenges={challenges} onOpen={setSelected} joinedIds={joinedIds} />
      <Explorer challenges={challenges} onOpen={setSelected} joinedIds={joinedIds} />
      <LeaderboardSection />
      <AchievementsSection />
      <DashboardSection userName={user.joined ? user.name : "Explorer"} />
      <AboutSection />
      <FinalCTA onStart={handleStartImpact} />
      <Footer />

      <AnimatePresence>
        {selected && (
          <ChallengeModal
            challenge={selected}
            onClose={() => setSelected(null)}
            joined={joinedIds.has(selected.id)}
            onJoin={handleJoinChallenge}
          />
        )}
      </AnimatePresence>

      <AnimatePresence>
        {showJoin && <JoinModal onClose={() => setShowJoin(false)} onSubmit={handleJoinSubmit} />}
      </AnimatePresence>

      <ToastStack toasts={toasts} remove={(id) => setToasts((t) => t.filter((x) => x.id !== id))} />
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
